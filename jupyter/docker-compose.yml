services:
  jupyter:
    build: .
    image: jupyter-copilot
    container_name: jupyter
    ports:
      - "10000:8888"
    volumes:
      - ${TARGET_DIR}:/home/jovyan/work

  tensorboard:
    build: .
    image: jupyter-copilot
    container_name: tensorboard
    command:
      - tensorboard
      - --logdir=/home/jovyan/work
      - --host=0.0.0.0
      - --port=6006
    ports:
      - "6006:6006"
    volumes:
      - ${TARGET_DIR}:/home/jovyan/work
